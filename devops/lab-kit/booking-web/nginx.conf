# booking-web: static page + reverse proxy to booking-api. API_UPSTREAM is substituted at start-up
# by the nginx image's envsubst templates (e.g. http://booking-api:8080 in compose / Kubernetes).
server {
  listen 8080;
  location = /healthz { return 200 "ok\n"; }
  location /api/ { proxy_pass ${API_UPSTREAM}/; proxy_set_header Host $host; }
  location / { root /usr/share/nginx/html; try_files $uri /index.html; }
}
