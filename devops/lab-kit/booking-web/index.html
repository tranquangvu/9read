<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Clinic booking</title>
<style>body{font:16px system-ui;max-width:40rem;margin:3rem auto;padding:0 1rem}input,button{font:inherit;padding:.4rem}</style></head>
<body>
<h1>Clinic booking</h1>
<form id="f"><input name="patient" placeholder="Patient name" required> <input name="slot" type="datetime-local" required> <button>Book</button></form>
<ul id="list"></ul>
<script>
const api = "/api";   // booking-web proxies /api/* to booking-api (nginx.conf)
async function load(){ const r = await fetch(api + "/bookings"); const rows = await r.json();
  document.getElementById("list").innerHTML = rows.map(b => `<li>#${b.id} ${b.patient} — ${b.slot}</li>`).join(""); }
document.getElementById("f").onsubmit = async (e) => { e.preventDefault(); const d = Object.fromEntries(new FormData(e.target));
  await fetch(api + "/bookings", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(d) }); load(); };
load();
</script>
</body></html>
