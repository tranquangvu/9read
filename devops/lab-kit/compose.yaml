# Local stack for the labs: docker compose up --build   →  http://localhost:3000
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: clinic, POSTGRES_PASSWORD: clinic, POSTGRES_DB: clinic }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U clinic"], interval: 5s, retries: 10 }
    volumes: [pgdata:/var/lib/postgresql/data]
  booking-api:
    build: ./booking-api
    environment:
      DATABASE_URL: postgres://clinic:clinic@postgres:5432/clinic
      APP_VERSION: local
      CHAOS: "on"
    ports: ["8080:8080"]
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "/nodejs/bin/node", "healthcheck.js"], interval: 10s }
  booking-web:
    build: ./booking-web
    ports: ["3000:8080"]
    depends_on: [booking-api]
volumes:
  pgdata: {}
