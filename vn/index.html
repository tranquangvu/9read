<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chủ đề — chuyên sâu kỹ thuật</title>
<script>(function(){if(localStorage.getItem('fde-theme')==='dark')document.documentElement.classList.add('dark');if(localStorage.getItem('fde-nav')==='collapsed')document.documentElement.classList.add('nav-collapsed');})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: { extend: {
    colors: {
      cream:'#FAF9F5', creamdark:'#0A0A0A',
      card:'#FFFFFF', carddark:'#161618',
      sand:'#F0EEE6', sanddark:'#222225',
      ink:'#141413', inkdark:'#F0EEE9',
      mute:'#6E6B64', mutedark:'#A8A49B',
      line:'#E6E3DA', linedark:'#2A2A2E',
      coral:{ DEFAULT:'#D97757', deep:'#B4532E', soft:'#F7E9E2', softdark:'#4A352C' },
      viol:{ DEFAULT:'#6d5acd', soft:'#efecfb', softdark:'#332e4d' },
    },
    fontFamily: {
      display:['"Space Grotesk"','Inter','ui-sans-serif','sans-serif'],
      body:['Inter','ui-sans-serif','-apple-system','sans-serif'],
      mono:['"JetBrains Mono"','ui-monospace','monospace'],
    },
  }}
};
</script>
<link rel="stylesheet" href="../assets/site.css">
<script defer src="../assets/site.js"></script>
</head>
<body class="bg-cream dark:bg-creamdark text-ink dark:text-inkdark font-body antialiased">

<div class="hub-bg"></div>
<div class="hub-grid"></div>

<div class="relative min-h-screen flex flex-col max-w-[64rem] mx-auto px-6">

  <header class="absolute top-5 right-6 flex items-center justify-end">
    <button data-theme-toggle class="w-9 h-9 rounded-full border border-line dark:border-linedark bg-card/60 dark:bg-carddark/50 backdrop-blur flex items-center justify-center text-mute dark:text-mutedark hover:border-coral hover:text-coral transition-colors" aria-label="Đổi giao diện">
      <span data-theme-icon class="inline-flex align-middle"></span>
    </button>
  </header>

  <main class="my-auto py-12">
    <section class="pb-16 md:pb-20">
      <p class="hub-eyebrow rise rise-1 font-mono text-[11px] font-semibold uppercase tracking-[0.18em] text-coral">
        Chương trình đào tạo kỹ thuật
      </p>
      <h1 class="rise rise-2 font-display text-[2.4rem] md:text-[3.75rem] font-bold mt-5 tracking-[-0.03em] leading-[1.03] max-w-[20ch]">
        Hướng dẫn chuyên sâu cho kỹ sư <span class="hub-accent">thực chiến</span>
      </h1>
      <p class="rise rise-3 mt-6 text-[15px] md:text-[17px] text-mute dark:text-mutedark leading-relaxed max-w-[54ch]">
        Mỗi chủ đề là một chương trình đào tạo hoàn chỉnh — nguyên lý trước, sau đó là bài tập thực hành,
        rồi đến sản phẩm bằng chứng xứng đáng để trình bày. Được xây dựng để bạn thực hành, không phải để đọc lướt.
      </p>
    </section>

    <section class="rise rise-4">
      <div class="flex items-baseline justify-between gap-4 pb-4">
        <h2 class="font-mono text-[11px] font-semibold uppercase tracking-[0.18em] text-mute dark:text-mutedark">Chủ đề</h2>
        <span id="topic-count" class="font-mono text-[11px] text-mute dark:text-mutedark"></span>
      </div>
      <div id="topic-list" class="topic-list"></div>
    </section>
  </main>

</div>

</body>
</html>
